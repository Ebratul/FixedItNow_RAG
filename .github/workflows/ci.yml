# Continuous integration. It uses NO secrets and NO production credentials: every
# value below is a throwaway for a disposable service container. It never deploys
# and never touches a real database or provider. Failed checks fail the job.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-service:
    name: AI service (ruff, mypy, pytest + offline evaluation, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt pip-audit
      - run: ruff check .
      - run: mypy
      - run: pytest -q          # includes the evaluation set (tests/test_eval.py)
      - run: pip-audit -r requirements.txt

  image:
    name: Container image build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [ai-service]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fixeditnow-ai .
